apiVersion: v1
kind: Namespace
metadata:
  name: nsmbhd
  labels:
    kubernetes.io/metadata.name: nsmbhd
    # Both pods below satisfy "restricted"; enforce it so a future edit that
    # drops a securityContext gets rejected instead of quietly running as root.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest

############################
###         MYSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql
  namespace: nsmbhd
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
  storageClassName: local-path

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: nsmbhd
spec:
  ports:
    - protocol: TCP
      name: mysql
      port: 3306
  selector:
    app: mysql

---
kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: nsmbhd
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # The entrypoint normally starts as root and gosu's down to mysql. Start as
      # mysql (999) directly instead, so nothing in the pod ever holds root and
      # every capability can go. fsGroup fixes up the mountpoint's ownership,
      # which the provisioner creates as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mysql
        image:  mysql:8.4.10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi
        ports:
        - name: mysql
          containerPort: 8806
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: root
        - name: MYSQL_USER
          value: nsmbhd
        - name: MYSQL_PASSWORD
          value: nsmbhd
        - name: MYSQL_DATABASE
          value: nsmbhd
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mysql



############################
###        NSMBHD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nsmbhd
  namespace: nsmbhd
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
  storageClassName: local-path

---
apiVersion: v1
kind: Service
metadata:
  name: nsmbhd
  namespace: nsmbhd
spec:
  ports:
    - protocol: TCP
      name: web
      port: 8000
  selector:
    app: nsmbhd

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nsmbhd
  namespace: nsmbhd
  labels:
    app: nsmbhd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nsmbhd
  template:
    metadata:
      labels:
        app: nsmbhd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The schema migrations are not reachable over HTTP. Run them here instead,
      # before any traffic hits the new image. Upgrade() is idempotent.
      initContainers:
      - name: upgrade
        image: $IMAGE
        imagePullPolicy: Never
        args: ["upgrade"]
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 256Mi
        env:
        - name: MYSQL_HOST
          value: mysql
        - name: MYSQL_USER
          value: nsmbhd
        - name: MYSQL_PASSWORD
          value: nsmbhd
        - name: MYSQL_DATABASE
          value: nsmbhd
        - name: ABXD_SALT
          valueFrom:
            secretKeyRef:
              name: nsmbhd
              key: salt
      containers:
      - name: nsmbhd
        image: $IMAGE
        imagePullPolicy: Never
        args: ["serve"]
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # Sized for pm.max_children = 5 in conf/php-fpm.conf. If that goes up,
        # so does the memory limit.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 768Mi
        ports:
        - name: web
          containerPort: 8000
        env:
        - name: MYSQL_HOST
          value: mysql
        - name: MYSQL_USER
          value: nsmbhd
        - name: MYSQL_PASSWORD
          value: nsmbhd
        - name: MYSQL_DATABASE
          value: nsmbhd
        - name: ABXD_SALT
          valueFrom:
            secretKeyRef:
              name: nsmbhd
              key: salt
        - name: ABXD_SFS_KEY
          valueFrom:
            secretKeyRef:
              name: nsmbhd
              key: sfs-key
        - name: SMTP_HOST
          value: smtp.gmail.com
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_FROM
          value: noreply2@dirbaio.net
        - name: SMTP_USER
          value: noreply2@dirbaio.net
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nsmbhd
              key: smtp-password
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: var-lib-php-sessions
          mountPath: /var/lib/php/sessions
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nsmbhd
      - name: tmp
        emptyDir: {}
      - name: var-lib-php-sessions
        emptyDir: {}

---
# Requires a matching `nsmbhd-net` HTTPS listener on the `prod` Gateway in
# torii-system (hostname nsmbhd.net, cert secret tls-nsmbhd-net, allowedRoutes
# selecting the nsmbhd namespace). See gateway-listener.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nsmbhd
  namespace: nsmbhd
spec:
  hostnames:
  - nsmbhd.net
  parentRefs:
  - name: prod
    namespace: torii-system
    sectionName: nsmbhd-net
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nsmbhd
      port: 8000
