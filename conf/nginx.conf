worker_processes 4;
pid /tmp/nginx.pid;
daemon off;
error_log /dev/stdout info;

events {
    worker_connections 768;
    # multi_accept on;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Per-IP ceiling on the dynamic pages, so login brute force, registration
    # spam and captcha grinding cost something. $binary_remote_addr is the real
    # client: the gateway sets X-Forwarded-For and users can't (see CLAUDE.md).
    # Static files are not limited.
    limit_req_zone $binary_remote_addr zone=php:10m rate=10r/s;
    limit_req_status 429;

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging Settings
    ##
    access_log /dev/stdout;
    error_log /dev/stdout;

    ##
    # Gzip Settings
    ##

    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript image/png application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 50000;  #50 kb

    # All five default to /var/lib/nginx, which is on the read-only root
    # filesystem in the cluster -- nginx refuses to start when it can't create
    # them. /tmp is the emptyDir from deploy.yaml.
    # Flat, because nginx creates these with a single non-recursive mkdir().
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    proxy_temp_path       /tmp/nginx-proxy;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Slightly above php.ini's post_max_size of 200M, to leave room for the
    # multipart framing around a 200M file. Anything past this is refused here
    # instead of being spooled to disk in full and then rejected by PHP.
    client_max_body_size 210m;

    ##
    # Virtual Host Configs
    ##

    map $http_x_forwarded_proto $forwarded_https {
        default "";
        https on;
    }

    map $http_x_forwarded_proto $forwarded_scheme {
        "" $scheme;
        default $http_x_forwarded_proto;
    }

    map $http_x_forwarded_port $forwarded_port {
        "" $server_port;
        default $http_x_forwarded_port;
    }

    server {
        set_real_ip_from  0.0.0.0/0;
        real_ip_header    X-Forwarded-For;
        listen 8000 default_server;

        root /app/webroot;
        index index.php index.html index.htm;
        try_files $uri $uri/ /404/;

        # Liveness. Deliberately does not go near php-fpm: a saturated worker
        # pool is not a reason to restart the pod.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Readiness. php-fpm's own ping page, via ping.path in php-fpm.conf. FPM
        # matches it on SCRIPT_NAME, but resolves the primary script first, so
        # SCRIPT_FILENAME has to be set too or it answers "File not found."
        location = /healthz/php {
            access_log off;
            fastcgi_pass unix:/tmp/php5-fpm.sock;
            fastcgi_param SCRIPT_NAME     /ping;
            fastcgi_param SCRIPT_FILENAME /ping;
            fastcgi_param REQUEST_URI     /ping;
            fastcgi_param REQUEST_METHOD  $request_method;
            fastcgi_param QUERY_STRING    "";
        }

        location ~* /data/builds/ {
        	deny all;
        }
        location ~* /data/uploads/ {
        	deny all;
        }
        location ~* /pages/ {
        	deny all;
        }
        location ~* .*\.git {
        	deny all;
        }
        location ~* .*\.svn {
        	deny all;
        }
        location ~ /\.ht {
        	deny all;
        }
        # Everything under /data/ is user-supplied. Nothing there may be served
        # as a type the browser will execute on the board's own origin -- an
        # uploaded .html would otherwise be same-origin script. Listed after the
        # deny blocks above, so those still win.
        location ~* ^/data/.*\.(html?|xhtml|xml|svg|js)$ {
            types { }
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ ~$ {
            deny all;
        }

        # install.php and upgrade.php are deliberately absent: they take no
        # authentication, so they are CLI-only. See conf/launch.sh.
        location ~ ^/(spritexml|get|index|themes/[a-zA-Z0-9]+/style)\.php$ {
            # Burst is generous: one page view fans out into several of these.
            limit_req zone=php burst=30 nodelay;

            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            fastcgi_pass   unix:/tmp/php5-fpm.sock;
            fastcgi_index  index.php;

            fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;

            fastcgi_param  QUERY_STRING       $query_string;
            fastcgi_param  REQUEST_METHOD     $request_method;
            fastcgi_param  CONTENT_TYPE       $content_type;
            fastcgi_param  CONTENT_LENGTH     $content_length;

            fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
            fastcgi_param  REQUEST_URI        $request_uri;
            fastcgi_param  DOCUMENT_URI       $document_uri;
            fastcgi_param  DOCUMENT_ROOT      $document_root;
            fastcgi_param  SERVER_PROTOCOL    $server_protocol;
            fastcgi_param  REQUEST_SCHEME     $forwarded_scheme;
            fastcgi_param  HTTPS              $forwarded_https if_not_empty;

            fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
            fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;

            fastcgi_param  REMOTE_ADDR        $remote_addr;
            fastcgi_param  REMOTE_PORT        $remote_port;
            fastcgi_param  SERVER_ADDR        $server_addr;
            fastcgi_param  SERVER_PORT        $forwarded_port;
            fastcgi_param  SERVER_NAME        $http_host;

            # PHP only, required if PHP was built with --enable-force-cgi-redirect
            fastcgi_param  REDIRECT_STATUS    200;

        }

        location ~ \.php$ {
    		deny all;
    	}

        rewrite  ^/themes/(.*)$ /themes/$1 last;
    	rewrite  ^/img/(.*)$ /img/$1 last;
    	rewrite  ^/data/(.*)$ /data/$1 last;
    	rewrite  ^/plugins/(.*)$ /plugins/$1 last;
    	rewrite  ^/css/(.*)$ /css/$1 last;
    	rewrite  ^/js/(.*)$ /js/$1 last;
        rewrite  ^/file/([a-zA-Z0-9]+)$  /get.php?id=$1  last;
    	rewrite  ^/file/([a-zA-Z0-9]+)/(.+)$  /get.php?id=$1  last;
    	rewrite  ^/([a-zA-Z0-9]+)/$  /?page=$1&rewritten=1  last;
    	rewrite  ^/([a-zA-Z0-9]+)/([^-]+)-(.*)/$  /?page=$1&id=$2&rewriteurlname=$3&rewritten=1  last;
        rewrite  ^/([a-zA-Z0-9]+)/(.+)/$  /?page=$1&id=$2&rewritten=1  last;

        # "always" so they're on error responses too. HSTS is only honoured over
        # HTTPS, so it's inert under `./d start`.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
