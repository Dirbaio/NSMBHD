; Local-development overrides, loaded only when PHP_INI_SCAN_DIR points here --
; see the `start` case in ./d. Production never reads this file, so anything
; loosened here fails closed if the env var is missing.

; `./d start` serves plain HTTP on localhost, so a Secure session cookie would
; never be sent back. Nothing starts a session today -- the image captcha that
; used to was the only caller -- but this keeps that from becoming a confusing
; local-only failure the day something does.
session.cookie_secure = 0
