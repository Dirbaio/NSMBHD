; Only settings that differ from the PHP 8.5 built-in defaults.

short_open_tag = Off
output_buffering = 4096
serialize_precision = 17
enable_dl = Off
max_input_time = 60
post_max_size = 200M
upload_max_filesize = 200M
variables_order = "GPCS"
request_order = "GP"

disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,

; Errors go to the log only, never to the client.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
fastcgi.logging = 0
; error_log is deliberately left unset: PHP then routes errors through the FPM
; SAPI logger into php-fpm.conf's error_log. Setting it to /dev/stdout here
; silently discards them - FPM points fd 1 at /dev/null before PHP resolves the
; /dev/stdout -> /proc/self/fd/1 symlink. See catch_workers_output in php-fpm.conf.

mail.add_x_header = On

session.gc_probability = 0
session.gc_divisor = 1000
