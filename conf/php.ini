; Only settings that differ from the PHP 8.5 built-in defaults.

short_open_tag = Off
expose_php = Off
output_buffering = 4096
serialize_precision = 17
enable_dl = Off
max_input_time = 60
post_max_size = 200M
upload_max_filesize = 200M
variables_order = "GPCS"
request_order = "GP"

; The board shells out nowhere, so a code-execution bug should have no shell to
; reach for. mail() is unaffected -- it popen()s sendmail from C, not from here.
disable_functions = exec,shell_exec,system,passthru,popen,pclose,proc_open,proc_close,proc_nice,proc_terminate,proc_get_status,dl,pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,

; The only paths the app has any business touching: its own code, the uploads
; volume (webroot/data is a symlink to /data, and this is checked against the
; resolved path), the scratch dir, and the session store. Turns a path traversal
; into a failed fopen().
open_basedir = /app/:/data/:/tmp/:/var/lib/php/sessions/:/usr/share/php/

; Errors go to the log only, never to the client.
; PHP 8 promoted "Undefined variable" and "Undefined array key" from E_NOTICE to
; E_WARNING. This codebase predates that and emits hundreds of them per request.
; error_reporting has no per-message granularity, so the whole E_WARNING/E_NOTICE
; class goes; only real errors are left.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_WARNING & ~E_NOTICE
display_errors = Off
display_startup_errors = Off
log_errors = On
fastcgi.logging = 0
; error_log is deliberately left unset: PHP then routes errors through the FPM
; SAPI logger into php-fpm.conf's error_log. Setting it to /dev/stdout here
; silently discards them - FPM points fd 1 at /dev/null before PHP resolves the
; /dev/stdout -> /proc/self/fd/1 symlink. See catch_workers_output in php-fpm.conf.

mail.add_x_header = On

; Nothing currently uses PHP's own sessions: the Securimage captcha was the only
; caller of session_start(), and Turnstile replaced it. The login session is the
; app's "logsession" cookie, which sets its own flags. Kept as a safe default so
; anything that does start a session gets a locked-down cookie by construction.
; cookie_secure is turned back off for local dev in conf/dev/dev.ini.
session.save_path = /var/lib/php/sessions
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Debian ships gc_probability = 0 because it expects a cron job to sweep the
; session dir. There is no cron in this image, so nothing ever expired a session
; file. Sweep them inline instead; it's a 1-in-1000 chance per request.
session.gc_probability = 1
session.gc_divisor = 1000
